name: Release Velopack

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Read application version
        id: version
        shell: pwsh
        run: |
          $versionPayload = Get-Content "version.json" -Raw | ConvertFrom-Json
          $version = [string]$versionPayload.version
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Nu am putut citi versiunea din version.json."
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Versiunea din version.json trebuie sa fie SemVer simplu, ex: 1.0.10."
          }

          ./scripts/sync-version.ps1 -Verify

          if ("${{ github.ref_type }}" -eq "tag") {
            $expectedTag = "v$version"
            if ("${{ github.ref_name }}" -ne $expectedTag) {
              throw "Tag-ul ${{ github.ref_name }} nu corespunde versiunii din proiect ($expectedTag)."
            }
          }

          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build and run regression tests
        shell: pwsh
        run: |
          dotnet build "SubtitlesFixer.sln" -c Release
          dotnet run --project "SubtitlesFixer.Tests/SubtitlesFixer.Tests.csproj" -c Release --no-build

      - name: Publish application
        shell: pwsh
        run: |
          dotnet publish "SubtitlesFixer.App/SubtitlesFixer.App.csproj" `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -o publish

      - name: Build and upload Velopack release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true

          dotnet tool install -g vpk --version 0.0.1298
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"

          vpk download github `
            --repoUrl "https://github.com/${{ github.repository }}" `
            --token "${{ secrets.GITHUB_TOKEN }}"

          $currentVersion = [Version]"${{ steps.version.outputs.version }}"
          $blockingVersion = Get-ChildItem -Path Releases -Filter "SubtitlesFixer-*-full.nupkg" -ErrorAction SilentlyContinue |
            ForEach-Object {
              if ($_.BaseName -match '^SubtitlesFixer-(?<version>\d+\.\d+\.\d+(?:\.\d+)?)-') {
                [Version]$Matches.version
              }
            } |
            Where-Object { $_ -ge $currentVersion } |
            Sort-Object -Descending |
            Select-Object -First 1

          if ($blockingVersion) {
            throw "Channel-ul win are deja versiunea $blockingVersion, egala sau mai mare decat $currentVersion. Creste version.json si reporneste release-ul."
          }

          vpk pack `
            --packId "SubtitlesFixer" `
            --packVersion "${{ steps.version.outputs.version }}" `
            --packDir publish `
            --mainExe "SubtitlesFixer.exe"

          vpk upload github `
            --repoUrl "https://github.com/${{ github.repository }}" `
            --token "${{ secrets.GITHUB_TOKEN }}" `
            --merge `
            --publish `
            --releaseName "v${{ steps.version.outputs.version }}" `
            --tag "v${{ steps.version.outputs.version }}"

      - name: Update release notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $tag = "v$version"
          $prevTag = git describe --tags --abbrev=0 "$tag^" 2>$null
          if ($prevTag) {
            $log = git log --pretty=format:"- %s" "$prevTag..$tag" -- | Out-String
          } else {
            $log = git log --pretty=format:"- %s" "$tag" -- | Out-String
          }
          $notes = "## Subtitles Fixer $tag`n`n### Commits:`n$($log.Trim())`n`n### Instalare:`n- **Setup**: Descarca ``SubtitlesFixer-win-Setup.exe`` si instaleaza (cu update automat).`n- **Portable**: Descarca ``SubtitlesFixer-win-Portable.zip`` si extrage oriunde."
          gh release edit $tag --notes $notes
